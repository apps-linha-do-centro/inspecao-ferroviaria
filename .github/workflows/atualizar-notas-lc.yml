name: Atualizar Notas LC e conferencias
on:
  workflow_dispatch:
  repository_dispatch:
    types: [notas_lc_csv_atualizado]
  push:
    branches: [main]
    paths:
      - .github/workflows/atualizar-notas-lc.yml
      - notas-lc-campo/automation/**
  schedule:
    - cron: '45 9,10 * * *'
permissions:
  contents: write
concurrency:
  group: atualizar-notas-lc-main
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - uses: actions/checkout@v4
        with:
          ref: notas-lc-inbox
          path: entrada
          fetch-depth: 0
      - name: Testar contratos e entradas independentes
        run: |
          python3 -m unittest discover -s site/notas-lc-campo/automation -p 'test_*.py' -v
          node site/notas-lc-campo/automation/test-audit-ui.mjs
          node site/notas-lc-campo/automation/test-base-updates.mjs
          node site/notas-lc-campo/automation/test-apps-script.mjs
      - name: Processar notas e conferencias independentemente
        run: |
          DATA_NOTAS="$(TZ=America/Sao_Paulo date -d "$(git -C entrada log -1 --format=%cI -- notas-lc-campo/automation/incoming.csv)" +%F)"
          python3 site/notas-lc-campo/automation/sync_inputs.py --site site --entry entrada --notes-date "$DATA_NOTAS" --report /tmp/notas-sync.json
      - name: Publicar arquivos validados
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- notas-lc-campo/notes.json.gz notas-lc-campo/base-status.json notas-lc-campo/index.html notas-lc-campo/sw.js notas-lc-campo/audit-data.js notas-lc-campo/automation/processed-inputs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Atualizar notas e conferencias validadas'
          git push origin HEAD:main
      - name: Informar entradas rejeitadas sem apagar as bases validas
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/notas-sync.json')
          if p.exists():
              r=json.loads(p.read_text());print(json.dumps(r,ensure_ascii=False,indent=2))
              if r['errors']:raise SystemExit('Entradas rejeitadas; outras atualizacoes validas foram preservadas.')
          PY
