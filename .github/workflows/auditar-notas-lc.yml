name: Auditar Notas LC (sem publicar)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - notas-lc-campo/app.js
      - notas-lc-campo/core.js
      - notas-lc-campo/audit.js
      - notas-lc-campo/audit-data.js
      - notas-lc-campo/automation/**
      - .github/workflows/auditar-notas-lc.yml
permissions:
  contents: read
jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe e testes de entradas
        run: |
          node --check notas-lc-campo/app.js
          node --check notas-lc-campo/core.js
          node --check notas-lc-campo/audit.js
          node --check notas-lc-campo/sw.js
          node notas-lc-campo/automation/test-audit-ui.mjs
          node notas-lc-campo/automation/test-base-updates.mjs
          node notas-lc-campo/automation/test-yag.mjs
          node notas-lc-campo/automation/test-apps-script.mjs
          python3 -m unittest discover -s notas-lc-campo/automation -p 'test_*.py' -v
      - name: Verificar integridade dos identificadores da base
        run: |
          python3 - <<'PY'
          import gzip,json,re
          from pathlib import Path
          with gzip.open('notas-lc-campo/notes.json.gz','rt',encoding='utf8') as f:data=json.load(f)
          rows=data['abas'][0]['linhas'];ids=[str(r[2]).strip().lstrip('0') for r in rows]
          assert len(ids)==len(set(ids)) and all(re.fullmatch('[0-9]+',v) for v in ids)
          status=json.loads(Path('notas-lc-campo/base-status.json').read_text())
          assert len(rows)==status['total']
          print('Base íntegra:',len(rows),'notas; versão',data['versao_base'])
          PY
